<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProServ Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

<style>
/* ── TOKENS ── */
:root {
  --bg:       #07090c;
  --panel:    #0e1117;
  --surface:  #161a21;
  --card:     #1c2029;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.11);
  --fg1:      #F0F2F5;
  --fg2:      #B8BDC8;
  --fg3:      #606672;
  --orange:   #F26310;
  --orangelo: rgba(242,99,16,0.14);
  --green:    #2ECC76;
  --red:      #E84040;
  --map-bg:   #0d1320;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg1);
  font-family: 'Barlow', system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── LOADING / ERROR SCREENS ── */
#loadScreen, #errScreen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 100;
}
#errScreen { display: none; }
.load-logo {
  width: 52px; height: 52px;
  background: var(--orange);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  animation: pulse 1.8s ease-in-out infinite;
}
.load-logo svg { width: 30px; height: 30px; fill: white; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.load-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--fg3);
}
.err-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px; font-weight: 900; color: var(--fg1);
}
.err-sub { font-size: 13px; color: var(--fg3); text-align: center; padding: 0 32px; line-height: 1.5; }
.err-btn {
  margin-top: 8px;
  background: var(--orange); color: #fff; border: none;
  border-radius: 10px; padding: 12px 28px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 900; letter-spacing: .08em;
  text-transform: uppercase; cursor: pointer;
}

/* ── MAIN FRAME ── */
#driveFrame {
  display: none; /* shown after load */
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-columns: 1fr 240px;
  /* rows set by setPlat() */
  background: var(--bg);
}

/* ── TURN BANNER ── */
#turnBanner {
  grid-column: 1 / -1; grid-row: 1;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: stretch;
  overflow: hidden; height: 80px;
}
.t-arrow {
  width: 76px; background: var(--orange);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative;
}
.t-arrow::after {
  content: ''; position: absolute; right: -9px; top: 50%;
  transform: translateY(-50%);
  border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  border-left: 9px solid var(--orange); z-index: 2;
}
.t-arrow svg { width: 34px; height: 34px; }
.t-dist {
  padding: 0 14px 0 20px; display: flex; flex-direction: column;
  justify-content: center; flex-shrink: 0;
  border-right: 1px solid var(--border);
}
.t-dist-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 44px; font-weight: 900; color: var(--fg1);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.t-dist-unit {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; color: var(--orange);
  text-transform: uppercase; letter-spacing: .1em;
}
.t-street { padding: 0 16px; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.t-onto { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--fg3); }
.t-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px; font-weight: 800; color: var(--fg1);
  text-transform: uppercase; letter-spacing: .03em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.t-step {
  flex-shrink: 0; margin: auto 14px auto 0;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border2);
  border-radius: 20px; padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 800; color: var(--fg3);
  letter-spacing: .06em; white-space: nowrap;
}

/* ── MAP ── */
#mapEl {
  grid-column: 1; grid-row: 2;
  background: var(--map-bg);
  position: relative; overflow: hidden;
}
#map { position: absolute; inset: 0; }
.map-recenter {
  position: absolute; right: 10px; bottom: 10px; z-index: 5;
  width: 38px; height: 38px;
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--fg2);
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.map-recenter svg { width: 18px; height: 18px; }

/* ── VAN MARKER (Mapbox custom) ── */
.ps-van-marker {
  width: 44px; height: 44px;
  background: white; border-radius: 50%;
  border: 2.5px solid var(--orange);
  box-shadow: 0 0 0 5px rgba(242,99,16,0.18), 0 4px 18px rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  cursor: default;
}
.ps-van-marker svg { width: 26px; height: 26px; }

/* ── SIDEBAR ── */
#sidebar {
  grid-column: 2; grid-row: 2;
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-img {
  flex-shrink: 0; position: relative;
  height: 96px; overflow: hidden;
}
.sb-img img, .sb-img-bg {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.sb-img-bg {
  background: linear-gradient(150deg, #0d1828 0%, #162236 60%, #0a1520 100%);
  display: flex; align-items: center; justify-content: center;
}
.sb-img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.6) 100%);
}
.sb-badge {
  position: absolute; top: 8px; left: 8px;
  background: var(--orange); color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; border-radius: 4px; padding: 2px 7px;
}
.sb-info {
  padding: 10px 12px; flex: 1;
  display: flex; flex-direction: column; gap: 4px; min-height: 0;
}
.sb-svc {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 900;
  text-transform: uppercase; letter-spacing: .04em;
  color: var(--fg1); line-height: 1.1;
}
.sb-addr {
  display: flex; align-items: flex-start; gap: 4px;
  font-size: 10.5px; color: var(--fg2); line-height: 1.3;
}
.sb-addr svg { width: 10px; height: 10px; flex-shrink: 0; margin-top: 2px; color: var(--fg3); }
.sb-pay {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 900; color: var(--green);
  margin-top: auto;
}
.sb-nav-btn {
  margin: 0 10px 10px; flex-shrink: 0;
  background: var(--orange); color: #fff; border: none;
  border-radius: 10px; padding: 10px 0;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 900; letter-spacing: .08em;
  text-transform: uppercase; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity .15s;
}
.sb-nav-btn:active { opacity: .8; }
.sb-nav-btn svg { width: 13px; height: 13px; }
.sb-no-job {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  padding: 16px; text-align: center;
}
.sb-no-job svg { width: 28px; height: 28px; opacity: .3; }
.sb-no-job-txt {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--fg3);
  text-transform: uppercase; letter-spacing: .06em;
}

/* ── STATS BAR ── */
#statsBar {
  grid-column: 1 / -1; grid-row: 3;
  background: var(--panel); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1fr 1fr 68px;
}
.stat {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px;
  border-right: 1px solid var(--border); padding: 0 4px;
}
.stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 900; color: var(--fg1);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.stat-lbl {
  font-size: 8px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--fg3);
}
.end-btn {
  background: rgba(232,64,64,0.08); border: none;
  color: var(--red); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 900;
  letter-spacing: .1em; text-transform: uppercase;
  transition: background .15s;
}
.end-btn:active { background: rgba(232,64,64,0.18); }
.end-btn svg { width: 15px; height: 15px; }

/* ── AA NAV BAR (4th row, display:none until AA mode) ── */
#aaBar {
  grid-column: 1 / -1; grid-row: 4;
  background: #050709; border-top: 1px solid rgba(255,255,255,0.05);
  display: none; align-items: center; justify-content: space-around;
  padding: 0 20px;
}
.aa-ico { display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: .35; }
.aa-ico.on { opacity: 1; }
.aa-ico span {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 8px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--fg2);
}
.aa-ico.on span { color: var(--orange); }
.aa-ico svg { width: 15px; height: 15px; stroke: currentColor; }
.aa-ico.on svg { stroke: var(--orange); }

/* ── CONFIRM MODAL ── */
#endModal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); z-index: 50;
  align-items: center; justify-content: center;
}
#endModal.show { display: flex; }
.modal-box {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 14px; padding: 24px 28px;
  max-width: 280px; text-align: center;
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 900; color: var(--fg1); margin-bottom: 6px;
}
.modal-sub { font-size: 12px; color: var(--fg3); line-height: 1.5; margin-bottom: 20px; }
.modal-btns { display: flex; gap: 8px; }
.m-cancel {
  flex: 1; background: var(--surface); border: 1px solid var(--border2);
  color: var(--fg2); border-radius: 9px; padding: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 800; letter-spacing: .05em;
  text-transform: uppercase; cursor: pointer;
}
.m-end {
  flex: 1; background: rgba(232,64,64,0.12);
  border: 1px solid rgba(232,64,64,0.28);
  color: var(--red); border-radius: 9px; padding: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 800; letter-spacing: .05em;
  text-transform: uppercase; cursor: pointer;
}

/* ── HIDDEN ── */
[hidden] { display: none !important; }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadScreen">
  <div class="load-logo">
    <svg viewBox="0 0 20 20"><path d="M4 3h7c2.2 0 4 1.8 4 4s-1.8 4-4 4H8v6H4V3z"/></svg>

</div><!-- /driveFrame -->

<script>
'use strict';

/* ── CONSTANTS ── */
var SB_URL = 'https://chmicqvorgjqlthufgwt.supabase.co';

var _sb, _sess, _job, _map, _vanMk, _geoWtch, _plat;

/* ── PLATFORM DETECT ── */
function detectPlat() {
  var ua = navigator.userAgent || '';
  if (/CarPlay/i.test(ua)) return 'carplay';
  if (/Android/i.test(ua) && /AA-|AutomotiveOS|android_auto/i.test(ua)) return 'android';
  // heuristic: 800×480 or similar very wide/short landscape viewport
  var w = window.innerWidth, h = window.innerHeight;
  if (w >= 700 && h <= 520 && w > h * 1.4) return 'carplay'; // default CarPlay look
  return 'standard'; // phone/tablet — show same UI, no AA bar
}

function applyPlat(p) {
  _plat = p;
  var frame = document.getElementById('driveFrame');
  var aaBar = document.getElementById('aaBar');
  if (p === 'android') {
    frame.style.gridTemplateRows = '76px 1fr 60px 36px';
    aaBar.style.display = 'flex';
  } else {
    frame.style.gridTemplateRows = '80px 1fr 68px';
    aaBar.style.display = 'none';
  }
}

/* ── HELPERS ── */
function fmtPay(n) {
  var v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function setLoad(msg) {
  document.getElementById('loadMsg').textContent = msg;
}

function showErr(title, sub) {
  document.getElementById('loadScreen').style.display = 'none';
  var e = document.getElementById('errScreen');
  e.style.display = 'flex';
  document.getElementById('errTitle').textContent = title || 'Error';
  document.getElementById('errSub').textContent = sub || '';
}

function showDrive() {
  document.getElementById('loadScreen').style.display = 'none';
  document.getElementById('driveFrame').style.display = 'grid';
}

function svcCat(svc) {
  if (!svc) return 'General';
  var map = {
    'Snow Removal': 'Snow Removal',
    'Lawn Care': 'Lawn Care',
    'Landscaping': 'Landscaping',
    'Pressure Washing': 'Pressure Washing',
    'Gutter Cleaning': 'Gutter Cleaning',
    'Leaf Removal': 'Leaf Removal',
    'Junk Removal': 'Junk Removal',
    'Handyman': 'Handyman',
    'Painting': 'Painting',
    'Cleaning': 'Cleaning',
    'Window Cleaning': 'Window Cleaning',
    'Mulching': 'Mulching',
    'Tree Service': 'Tree Service',
    'Driveway Sealing': 'Driveway Sealing',
    'General': 'General'
  };
  for (var k in map) {
    if (svc.toLowerCase().indexOf(k.toLowerCase()) === 0) return k;
  }
  return svc.split(' - ')[0].split(' – ')[0].trim();
}

function svcBg(cat) {
  var bgs = {
    'Snow Removal':    'linear-gradient(135deg,#0d1828 0%,#162236 60%,#0a1520 100%)',
    'Lawn Care':       'linear-gradient(135deg,#0a1f0e 0%,#0f2c14 60%,#071510 100%)',
    'Landscaping':     'linear-gradient(135deg,#0a1f0e 0%,#102515 60%,#071510 100%)',
    'Pressure Washing':'linear-gradient(135deg,#0a1520 0%,#0d1d2e 60%,#091018 100%)',
    'Gutter Cleaning': 'linear-gradient(135deg,#111520 0%,#181d28 60%,#0c0f18 100%)',
    'Leaf Removal':    'linear-gradient(135deg,#1a1000 0%,#2a1a00 60%,#120c00 100%)',
    'Junk Removal':    'linear-gradient(135deg,#130a1a 0%,#1e1025 60%,#0e0814 100%)',
  };
  return bgs[cat] || 'linear-gradient(135deg,#0e1117 0%,#161a21 60%,#0a0c10 100%)';
}

/* ── RENDER SIDEBAR ── */
function renderSidebar(job) {
  var sb = document.getElementById('sidebar');
  if (!job) {
    sb.innerHTML =
      '<div class="sb-no-job">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2M8 7V5a2 2 0 0 0-4 0v2M2 13h20"/></svg>' +
        '<div class="sb-no-job-txt">No active job</div>' +
      '</div>';
    return;
  }
  var cat = svcCat(job.service || '');
  var icon = svcIcon(cat);
  var bg = svcBg(cat);
  var addr = job.address || job.serviceAddress || '—';
  var pay = fmtPay(job.contractorPay);

  sb.innerHTML =
    '<div class="sb-img">' +
      '<div class="sb-img-bg" style="background:' + bg + '">' + icon + '</div>' +
      '<div class="sb-img-overlay"></div>' +
      '<div class="sb-badge">Active Job</div>' +
    '</div>' +
    '<div class="sb-info">' +
      '<div class="sb-svc">' + escHtml(cat) + '</div>' +
      '<div class="sb-addr">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
        escHtml(addr) +
      '</div>' +
      '<div class="sb-pay">' + pay + '</div>' +
    '</div>' +
    '<button class="sb-nav-btn" onclick="openMaps()">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>' +
      'Navigate' +
    '</button>';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── MAPBOX INIT ── */
function initMap() {
  mapboxgl.accessToken = MB_TOKEN;
  _map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/navigation-night-v1',
    center: [-74.1, 40.1],
    zoom: 13,
    pitchWithRotate: false,
    attributionControl: false
  });

  _map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-right');

  // ProServ van marker
  var vanEl = document.createElement('div');
  vanEl.className = 'ps-van-marker';
  vanEl.innerHTML = '<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="6" y="5" width="28" height="18" rx="4" fill="#1a1e2b" stroke="#F26310" stroke-width="1.5"/>' +
    '<rect x="8" y="6" width="24" height="7" rx="2" fill="rgba(180,210,255,0.12)"/>' +
    '<rect x="10" y="7" width="20" height="4" rx="1.5" fill="#262c3e"/>' +
    '<text x="20" y="17" font-family="Arial Black,sans-serif" font-size="8" font-weight="900" fill="#F26310" text-anchor="middle">P</text>' +
    '<rect x="8" y="20" width="24" height="6" rx="2" fill="#141820" stroke="#333" stroke-width=".5"/>' +
    '<rect x="4" y="8" width="4" height="5" rx="1.5" fill="#333"/>' +
    '<rect x="32" y="8" width="4" height="5" rx="1.5" fill="#333"/>' +
    '<rect x="4" y="19" width="4" height="5" rx="1.5" fill="#333"/>' +
    '<rect x="32" y="19" width="4" height="5" rx="1.5" fill="#333"/>' +
  '</svg>';
  _vanMk = new mapboxgl.Marker({ element: vanEl, anchor: 'center' })
    .setLngLat([-74.1, 40.1])
    .addTo(_map);

  // Destination marker (added when job loaded)
  _map.on('load', function() {
    if (_destLng !== null) plotRoute();
  });
}

/* ── GEOLOCATION ── */
function startGeo() {
  if (!navigator.geolocation) return;
  _geoWtch = navigator.geolocation.watchPosition(function(pos) {
    _userLng = pos.coords.longitude;
    _userLat = pos.coords.latitude;
    if (_vanMk) _vanMk.setLngLat([_userLng, _userLat]);
    // speed
    var spd = pos.coords.speed ? Math.round(pos.coords.speed * 2.237) : 0;
    document.getElementById('sSpd').textContent = spd;
  }, null, { enableHighAccuracy: true, maximumAge: 2000 });
}

/* ── ROUTE / ETA ── */
function plotRoute() {
  if (!_map || !_destLng || !_userLng) return;
  var url = 'https://api.mapbox.com/directions/v5/mapbox/driving/' +
    _userLng + ',' + _userLat + ';' +
    _destLng + ',' + _destLat +
    '?geometries=geojson&overview=full&steps=true&access_token=' + MB_TOKEN;

  fetch(url).then(function(r){ return r.json(); }).then(function(data) {
    if (!data.routes || !data.routes.length) return;
    var route = data.routes[0];
    var leg = route.legs[0];
    var steps = leg.steps;

    // draw route line
    if (_map.getSource('route')) {
      _map.getSource('route').setData({ type: 'Feature', geometry: route.geometry });
    } else {
      _map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: route.geometry } });
      _map.addLayer({ id: 'route-glow', type: 'line', source: 'route',
        paint: { 'line-color': '#F26310', 'line-width': 8, 'line-opacity': 0.2 } });
      _map.addLayer({ id: 'route-line', type: 'line', source: 'route',
        paint: { 'line-color': '#F26310', 'line-width': 4, 'line-opacity': 0.9,
                 'line-dasharray': [2, 1.5] } });
    }

    // destination pin
    if (!_map.getSource('dest')) {
      _map.addSource('dest', { type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [_destLng, _destLat] } } });
      _map.addLayer({ id: 'dest-halo', type: 'circle', source: 'dest',
        paint: { 'circle-radius': 12, 'circle-color': '#F26310', 'circle-opacity': 0.2 } });
      _map.addLayer({ id: 'dest-dot', type: 'circle', source: 'dest',
        paint: { 'circle-radius': 6, 'circle-color': '#F26310' } });
    }

    // fit bounds
    var coords = route.geometry.coordinates;
    var bounds = coords.reduce(function(b, c) { return b.extend(c); }, new mapboxgl.LngLatBounds(coords[0], coords[0]));
    _map.fitBounds(bounds, { padding: { top: 40, bottom: 40, left: 40, right: 260 }, duration: 1200 });

    // ETA + distance
    var dur = route.duration; // seconds
    var dist = (route.distance / 1609.34).toFixed(1);
    var eta = new Date(Date.now() + dur * 1000);
    var h = eta.getHours() % 12 || 12, m = String(eta.getMinutes()).padStart(2,'0');
    document.getElementById('sEta').textContent = h + ':' + m;
    document.getElementById('sDist').textContent = dist;

    // first step turn instruction
    if (steps && steps.length > 0) {
      var step = steps[0];
      var d = step.distance;
      var dStr = d < 500 ? Math.round(d * 3.281) : (d / 1609.34).toFixed(1);
      var dUnit = d < 500 ? 'ft' : 'mi';
      document.getElementById('tDist').textContent = dStr;
      document.getElementById('tUnit').textContent = dUnit;
      var instr = step.maneuver && step.maneuver.instruction ? step.maneuver.instruction : '';
      var street = (step.name || '').toUpperCase() || 'CONTINUE';
      document.getElementById('tStreet').textContent = street;
      document.getElementById('tStep').textContent = 'STEP 1 / ' + steps.length;
    }
  }).catch(function(e) {
    console.warn('Route error', e);
  });
}

/* ── GEOCODE ADDRESS ── */
function geocodeAddr(addr, cb) {
  var url = 'https://api.mapbox.com/geocoding/v5/mapbox.places/' +
    encodeURIComponent(addr) +
    '.json?country=us&access_token=' + MB_TOKEN;
  fetch(url).then(function(r){ return r.json(); }).then(function(d) {
    if (d.features && d.features.length) {
      cb(d.features[0].center[0], d.features[0].center[1]);
    } else cb(null, null);
  }).catch(function(){ cb(null, null); });
}

/* ── OPEN NATIVE MAPS ── */
/* NOTE: window.open() is blocked in iOS standalone PWA mode.
   Use window.location.href so Apple Maps / Google Maps actually launches.
   On iOS this opens Apple Maps (maps:// scheme); on Android Google Maps. */
function openMaps() {
  if (!_job) return;
  var addr = _job.address || _job.serviceAddress || '';
  var ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/i.test(ua)) {
    window.location.href = 'maps://maps.apple.com/?daddr=' + encodeURIComponent(addr);
  } else {
    window.location.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(addr);
  }
}

/* ── RECENTER ── */
function recenter() {
  if (_map && _userLng !== null) {
    _map.flyTo({ center: [_userLng, _userLat], zoom: 14, duration: 800 });
  }
}

/* ── PORTAL NAV ── */
function goPortal() { window.location.href = 'index.html'; }

/* ── END ROUTE ── */
function showEnd() { document.getElementById('endModal').classList.add('show'); }
function hideEnd() { document.getElementById('endModal').classList.remove('show'); }
function doEnd()   { hideEnd(); window.location.href = 'index.html'; }

/* ── CLOCK ── */
function tickClock() {
  var now = new Date();
  var h = now.getHours() % 12 || 12;
  var m = String(now.getMinutes()).padStart(2,'0');
  // update ETA baseline if no route loaded yet
  if (document.getElementById('sEta').textContent === '—') {
    document.getElementById('sEta').textContent = h + ':' + m;
  }
}
setInterval(tickClock, 30000);
tickClock();

/* ── BOOT ── */
(function boot() {
  // 1. Check auth
  var raw = localStorage.getItem('ps_c_session');
  if (!raw) {
    window.location.href = 'index.html';
    return;
  }
  try { _sess = JSON.parse(raw); } catch(e) {
    window.location.href = 'index.html';
    return;
  }
  if (!_sess || !_sess.id) {
    window.location.href = 'index.html';
    return;
  }

  // 2. Detect platform, apply layout
  var p = detectPlat();
  applyPlat(p);

  // 3. Show frame (hide load screen after map init)
  setLoad('Connecting…');

  // 4. Init Supabase
  _sb = supabase.createClient(SB_URL, SB_KEY);

  // 5. Fetch active job
  setLoad('Loading job…');
  _sb.from('jobs')
    .select('*')
    .eq('contractor_id', _sess.id)
    .in('status', ['assigned', 'in_progress', 'en_route'])
    .order('scheduledDate', { ascending: true })
    .limit(1)
    .then(function(res) {
      if (res.error) {
        console.warn('Jobs error', res.error);
        // non-fatal — show drive with no job
        _job = null;
      } else {
        _job = (res.data && res.data.length) ? res.data[0] : null;
      }

      // render sidebar
      renderSidebar(_job);

      // 6. Init map
      setLoad('Loading map…');
      initMap();

      // 7. Start geolocation
      startGeo();

      // 8. Geocode destination
      if (_job) {
        var addr = _job.address || _job.serviceAddress || '';
        if (addr) {
          geocodeAddr(addr, function(lng, lat) {
            if (lng !== null) {
              _destLng = lng; _destLat = lat;
              if (_map.loaded()) plotRoute();
              else _map.on('load', plotRoute);
            }
          });
        }
      }

      // 9. Show UI
      showDrive();
    });
})();
</script>
