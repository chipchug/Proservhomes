<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your login code</title>
</head>
<body style="margin:0;padding:0;background:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f0f0;padding:32px 16px">
    <tr><td align="center">
      <table width="100%" style="max-width:560px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)">
        <!-- LOGO HEADER -->
        <tr><td style="background:#ffffff;padding:20px 28px 18px;border-bottom:3px solid #F26310;text-align:center">
          <img src="https://proservhomes.co/assets/logo-white.png"
               alt="ProServ Homes" width="180" style="display:block;margin:0 auto;height:auto;max-width:180px">
        </td></tr>
        <!-- BODY -->
        <tr><td style="padding:32px 28px 24px;text-align:center">
          <h1 style="margin:0 0 10px;font-family:Arial,sans-serif;font-size:22px;font-weight:800;color:#111">Your login code</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#555">Use this code to sign in to your ProServ Homes client portal:</p>
          <div style="display:inline-block;background:#f5f5f5;border-radius:12px;padding:18px 36px;margin-bottom:24px">
            <span style="font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:900;letter-spacing:10px;color:#F26310">{{ .Token }}</span>
          </div>
          <p style="margin:0;font-size:13px;color:#999;line-height:1.5">This code expires in 10 minutes.<br>If you didn't request this, you can safely ignore this email.</p>
        </td></tr>
        <!-- FOOTER -->
        <tr><td style="padding:16px 28px 24px;border-top:1px solid #ebebeb;text-align:center">
          <p style="margin:0;font-size:12px;color:#999;line-height:1.5">
            ProServ Homes &nbsp;·&nbsp; <a href="https://proservhomes.co" style="color:#F26310;text-decoration:none">proservhomes.co</a>
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
